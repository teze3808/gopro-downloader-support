name: Bug report
description: Report behavior that is broken or different from what you expected.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search existing issues first and provide steps that another person can follow.

        Do not include passwords, cookies, signed media URLs, certificate private keys, or private filenames.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Chrome extension
        - Runner dashboard
        - Cloud inventory
        - URL lookup
        - aria2 download
        - Existing-file or retry detection
        - HTTPS or certificate setup
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Mac with local runner
        - Windows with local runner
        - QNAP
        - Synology
        - Chrome download without runner
        - Other
    validations:
      required: true

  - type: input
    id: extension_version
    attributes:
      label: Extension version
      placeholder: For example, 0.2.32
    validations:
      required: true

  - type: input
    id: runner_version
    attributes:
      label: Runner version
      description: Enter "not used" if you selected Chrome download.
      placeholder: For example, 0.2.30 or not used
    validations:
      required: true

  - type: input
    id: chrome_version
    attributes:
      label: Chrome version
      description: Open chrome://settings/help to find it.
      placeholder: For example, 138.0.x
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open GoPro Media Library
        2. Select aria2 runner
        3. Click Start / Retry all downloads
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: What happened instead? Include the exact visible error message.
    validations:
      required: true

  - type: textarea
    id: support_summary
    attributes:
      label: Support summary
      description: In the extension, expand Advanced settings and click Copy support summary. Paste it here, or explain why it is unavailable.
      placeholder: Paste the reviewed support summary here.
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or reviewed diagnostic log
      description: Drag screenshots or a reviewed diagnostic log into this field. Remove private information first.
      placeholder: Optional attachments or additional context
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed passwords, cookies, signed URLs, certificate private keys, and private filenames.
          required: true
